<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OTP Verification</title>
</head>

<body style="margin:0; padding:0; background:#eef2f7; font-family:'Segoe UI', Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:40px 15px;">

        <!-- Card -->
        <table width="540" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:14px; overflow:hidden; box-shadow:0 8px 25px rgba(0,0,0,0.06);">

          <!-- Top Strip (soft accent) -->
          <tr>
            <td style="height:6px; background:linear-gradient(90deg,#6366f1,#818cf8,#a5b4fc);"></td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:35px 30px; text-align:center;">

              <h2 style="margin:0; color:#1e293b; font-weight:600;">
                Email Verification 🔐
              </h2>

              <p style="margin-top:12px; font-size:14px; color:#64748b; line-height:1.6;">
                Use the verification code below to continue securely.
              </p>

              <!-- OTP BOX -->
              <div style="
                margin:30px auto;
                display:inline-block;
                padding:16px 28px;
                font-size:30px;
                font-weight:700;
                letter-spacing:8px;
                border-radius:10px;
                background:#f1f5ff;
                color:#4f46e5;
                border:1px solid #c7d2fe;
                box-shadow:0 4px 12px rgba(99,102,241,0.15);
              ">
                ${OTP}
              </div>

              <p style="font-size:13px; color:#475569;">
                ⏳ Valid for <strong>5 minutes</strong>
              </p>

              <p style="font-size:12px; color:#94a3b8; margin-top:6px;">
                Don’t share this code with anyone.
              </p>

            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td>
              <hr style="border:none; border-top:1px solid #e2e8f0;">
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px; text-align:center; font-size:12px; color:#94a3b8;">
              © 2026 <span style="color:#6366f1; font-weight:600;">YourApp</span><br/>
              <a href="mailto:support@yourapp.com" style="color:#6366f1; text-decoration:none;">
                Contact Support
              </a>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
